# Pipeline Factory — one bundle ships the whole product: app + runner jobs + registry.
bundle:
  name: pipeline-factory

# dist/ is gitignored (build output) but the deploy artifact must ship it
sync:
  include:
    - app/deploy/dist/**
    - app/deploy/templates/**

variables:
  warehouse_id:
    description: SQL warehouse for registry + connectivity checks
    default: "7dd061ff3f16772e"
  llm_endpoint:
    description: FMAPI serving endpoint (config, never code — handoff §3)
    # Claude endpoints are rate-limited to 0 in this trial workspace; use
    # `--var llm_endpoint=databricks-claude-opus-4-8` once enabled.
    default: "databricks-llama-4-maverick"

resources:
  jobs:
    pipeline_runner:
      name: "pf-pipeline-runner"
      description: "Executes rendered SQL artifacts from the ctl artifacts volume + evaluates expectations"
      tags:
        generated_by: pipeline_factory_infra
      parameters:
        - name: spec_id
          default: ""
        - name: spec_version
          default: "1"
        - name: run_id
          default: ""
      tasks:
        - task_key: run
          spark_python_task:
            python_file: ./runners/pipeline_runner/pipeline_runner.py
            parameters:
              - "--spec-id"
              - "{{job.parameters.spec_id}}"
              - "--spec-version"
              - "{{job.parameters.spec_version}}"
              - "--run-id"
              - "{{job.parameters.run_id}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"

    recon_runner:
      name: "pf-recon-runner"
      description: "Count/key/attribute reconciliation driven by the spec compare config"
      tags:
        generated_by: pipeline_factory_infra
      parameters:
        - name: spec_id
          default: ""
        - name: spec_version
          default: "1"
        - name: run_id
          default: ""
        - name: recon_id
          default: ""
      tasks:
        - task_key: run
          spark_python_task:
            python_file: ./runners/recon_runner/recon_runner.py
            parameters:
              - "--spec-id"
              - "{{job.parameters.spec_id}}"
              - "--spec-version"
              - "{{job.parameters.spec_version}}"
              - "--run-id"
              - "{{job.parameters.run_id}}"
              - "--recon-id"
              - "{{job.parameters.recon_id}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"

  apps:
    pipeline_factory:
      name: "pipeline-factory"
      description: "Builds ingestion pipelines from natural-language interface contracts"
      source_code_path: ./app/deploy
      resources:
        - name: "sql-warehouse"
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: "CAN_USE"
        - name: "serving-endpoint"
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: "CAN_QUERY"
        - name: "pipeline-runner-job"
          job:
            id: ${resources.jobs.pipeline_runner.id}
            permission: "CAN_MANAGE_RUN"
        - name: "recon-runner-job"
          job:
            id: ${resources.jobs.recon_runner.id}
            permission: "CAN_MANAGE_RUN"
        - name: "github-token"
          secret:
            scope: "pipeline_factory"
            key: "github_token"
            permission: "READ"

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-5ff279f3-09b2.cloud.databricks.com

  # Stub only. The app itself refuses any non-dev target (hard constraint #3);
  # prod promotion belongs to customer CI after PR merge (docs/CICD_CONTRACT.md).
  prod:
    mode: production
    workspace:
      host: https://dbc-5ff279f3-09b2.cloud.databricks.com
      root_path: /Workspace/pipeline-factory/prod-STUB-DO-NOT-DEPLOY
