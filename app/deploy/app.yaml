command: ["node", "dist/server.js"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: PF_LLM_ENDPOINT
    valueFrom: serving-endpoint
  - name: PF_CATALOG
    value: "workspace"
  - name: PF_SCHEMA
    value: "ctl"
  - name: PF_TARGET
    value: "dev"
  - name: PF_JOB_PIPELINE_RUNNER
    valueFrom: pipeline-runner-job
  - name: PF_JOB_RECON_RUNNER
    valueFrom: recon-runner-job
  - name: PF_JOB_SFDC_INGEST
    valueFrom: sfdc-ingest-job
  - name: PF_SECRET_SCOPE
    value: "pipeline_factory"
  - name: PF_RUNNER_PRINCIPAL
    value: "ankurtripathi.cs@gmail.com"
  - name: PF_GITHUB_REPO
    value: "tripsankur/databricks-brnz-ingestion"
  - name: GITHUB_TOKEN
    valueFrom: github-token
