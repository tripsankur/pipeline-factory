command: ["node", "dist/server.js"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: PF_LLM_ENDPOINT
    valueFrom: serving-endpoint
  - name: PF_CATALOG
    value: "workspace"
  - name: PF_SCHEMA
    value: "ctl"
  - name: PF_TARGET
    value: "dev"
  - name: PF_SECRET_SCOPE
    value: "pipeline_factory"
  - name: PF_RUNNER_PRINCIPAL
    value: "ankurtripathi.cs@gmail.com"
  - name: PF_GITHUB_REPO
    value: "tripsankur/databricks-brnz-ingestion"
  - name: GITHUB_TOKEN
    valueFrom: github-token
  - name: PF_FRAMEWORK_ENGINE_PATH
    value: "/Workspace/Users/ankurtripathi.cs@gmail.com/.bundle/ingestion-framework/dev/files/engine"
  - name: PF_FRAMEWORK_RECON_JOB_NAME
    value: "pf-framework-recon"
  - name: PF_FRAMEWORK_MIN_VERSION
    value: "1.3.0"
  # endpoint resource path for @databricks/lakebase credential minting (the
  # runtime injects PGHOST/PGDATABASE but not always the endpoint path)
  - name: LAKEBASE_ENDPOINT
    value: "projects/pipeline-factory/branches/production/endpoints/primary"
