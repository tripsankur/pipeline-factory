<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5F7281"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2272B4"/>
    </marker>
  </defs>

  <rect width="1440" height="860" fill="#F4F6F9"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1440" height="64" fill="#14213D"/>
  <text x="32" y="40" font-size="24" font-weight="700" fill="#FFFFFF">Pipeline Factory — Solution Architecture</text>
  <text x="1408" y="26" font-size="12" fill="#AAB7C4" text-anchor="end">Interface contracts → governed, reconciled ingestion pipelines</text>
  <text x="1408" y="46" font-size="12" fill="#AAB7C4" text-anchor="end">Databricks Apps · Lakeflow · Unity Catalog · Lakebase</text>

  <!-- ZONE: SOURCES -->
  <rect x="24" y="92" width="200" height="560" rx="10" fill="#FFFFFF" stroke="#D7DEE6"/>
  <rect x="24" y="92" width="200" height="34" rx="10" fill="#2E4053"/>
  <text x="124" y="114" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">SOURCE SYSTEMS</text>

  <rect x="44" y="150" width="160" height="86" rx="8" fill="#EAF1F8" stroke="#2272B4" stroke-width="1.5"/>
  <text x="124" y="176" font-size="13" font-weight="700" fill="#14213D" text-anchor="middle">Salesforce</text>
  <text x="124" y="196" font-size="10.5" fill="#5F7281" text-anchor="middle">UC connection (OAuth U2M)</text>
  <text x="124" y="212" font-size="10.5" fill="#5F7281" text-anchor="middle">REST describe (drift + discovery)</text>

  <rect x="44" y="256" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#C9D2DB" stroke-dasharray="5 4"/>
  <text x="124" y="280" font-size="12" fill="#8396A5" text-anchor="middle">Files / cloud storage</text>
  <text x="124" y="298" font-size="10.5" fill="#AAB7C4" text-anchor="middle">Auto Loader (P2)</text>

  <rect x="44" y="332" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#C9D2DB" stroke-dasharray="5 4"/>
  <text x="124" y="356" font-size="12" fill="#8396A5" text-anchor="middle">Databases (CDC)</text>
  <text x="124" y="374" font-size="10.5" fill="#AAB7C4" text-anchor="middle">Lakeflow gateway (P4)</text>

  <!-- ZONE: FACTORY APP -->
  <rect x="256" y="92" width="330" height="560" rx="10" fill="#FFFFFF" stroke="#D7DEE6"/>
  <rect x="256" y="92" width="330" height="34" rx="10" fill="#2272B4"/>
  <text x="421" y="114" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PIPELINE FACTORY — DATABRICKS APP</text>

  <rect x="276" y="146" width="290" height="64" rx="8" fill="#F2F7FB" stroke="#B9CFE2"/>
  <text x="421" y="170" font-size="12.5" font-weight="700" fill="#14213D" text-anchor="middle">Contract intake + schema discovery</text>
  <text x="421" y="190" font-size="10.5" fill="#5F7281" text-anchor="middle">contract YAML validated · live field list from source</text>

  <rect x="276" y="226" width="290" height="64" rx="8" fill="#FDF1E8" stroke="#E8B48C"/>
  <text x="421" y="250" font-size="12.5" font-weight="700" fill="#8A4B17" text-anchor="middle">LLM spec generation (FMAPI)</text>
  <text x="421" y="270" font-size="10.5" fill="#8A6A50" text-anchor="middle">structured output: specs + deltas only — never code</text>

  <rect x="276" y="306" width="290" height="54" rx="8" fill="#FFF8E6" stroke="#D9BF6E"/>
  <text x="421" y="328" font-size="12.5" font-weight="700" fill="#6E5A12" text-anchor="middle">HUMAN GATE 1 · review + approve</text>
  <text x="421" y="346" font-size="10.5" fill="#8A794C" text-anchor="middle">reviewer edits persist as spec versions</text>

  <rect x="276" y="376" width="290" height="64" rx="8" fill="#F2F7FB" stroke="#B9CFE2"/>
  <text x="421" y="400" font-size="12.5" font-weight="700" fill="#14213D" text-anchor="middle">Renderer + provisioner</text>
  <text x="421" y="420" font-size="10.5" fill="#5F7281" text-anchor="middle">metadata files (golden-gated) · idempotent Lakeflow assets</text>

  <rect x="276" y="456" width="290" height="64" rx="8" fill="#F2F7FB" stroke="#B9CFE2"/>
  <text x="421" y="480" font-size="12.5" font-weight="700" fill="#14213D" text-anchor="middle">Build console · evidence · dashboards</text>
  <text x="421" y="500" font-size="10.5" fill="#5F7281" text-anchor="middle">fix loop ≤ 3 spec-deltas · prompts on the record</text>

  <rect x="276" y="546" width="290" height="56" rx="8" fill="#EFEAF7" stroke="#B7A4D8"/>
  <text x="421" y="568" font-size="12.5" font-weight="700" fill="#4B3878" text-anchor="middle">Lakebase Postgres (app state)</text>
  <text x="421" y="586" font-size="10.5" fill="#6E5E92" text-anchor="middle">specs · builds · llm_calls — ms reads, warehouse fallback</text>

  <!-- ZONE: LAKEFLOW -->
  <rect x="618" y="92" width="520" height="560" rx="10" fill="#FFFFFF" stroke="#D7DEE6"/>
  <rect x="618" y="92" width="520" height="34" rx="10" fill="#14213D"/>
  <text x="878" y="114" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">DATABRICKS — LAKEFLOW EXECUTION (per source)</text>

  <!-- workflow strip -->
  <rect x="638" y="146" width="480" height="92" rx="8" fill="#F2F7FB" stroke="#B9CFE2"/>
  <text x="652" y="168" font-size="12" font-weight="700" fill="#14213D">{source}_workflow — Lakeflow Job (cron from control plane)</text>
  <g font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">
    <rect x="650" y="182" width="66" height="40" rx="6" fill="#BE501E"/><text x="683" y="206">drift_check</text>
    <rect x="722" y="182" width="66" height="40" rx="6" fill="#2272B4"/><text x="755" y="206">ingest</text>
    <rect x="794" y="182" width="66" height="40" rx="6" fill="#2272B4"/><text x="827" y="206">etl</text>
    <rect x="866" y="182" width="66" height="40" rx="6" fill="#5F7281"/><text x="899" y="206">log_run</text>
    <rect x="938" y="182" width="66" height="40" rx="6" fill="#277C43"/><text x="971" y="206">recon</text>
    <rect x="1010" y="182" width="100" height="40" rx="6" fill="#8396A5"/><text x="1060" y="206">sync_1 … sync_4</text>
  </g>

  <!-- medallion flow -->
  <rect x="638" y="266" width="150" height="76" rx="8" fill="#EAF1F8" stroke="#2272B4" stroke-width="1.5"/>
  <text x="713" y="294" font-size="12" font-weight="700" fill="#14213D" text-anchor="middle">brnz_{src}_ingest</text>
  <text x="713" y="312" font-size="10" fill="#5F7281" text-anchor="middle">Lakeflow Connect</text>
  <text x="713" y="327" font-size="10" fill="#5F7281" text-anchor="middle">cursoring · SCD · deletes</text>

  <rect x="818" y="266" width="130" height="76" rx="8" fill="#E9D8C4" stroke="#C7A97F"/>
  <text x="883" y="299" font-size="12.5" font-weight="700" fill="#6E4A1F" text-anchor="middle">BRONZE</text>
  <text x="883" y="318" font-size="10" fill="#8A6A45" text-anchor="middle">bronze.{src}_{entity}</text>

  <rect x="978" y="266" width="140" height="76" rx="8" fill="#EAF1F8" stroke="#2272B4" stroke-width="1.5"/>
  <text x="1048" y="294" font-size="12" font-weight="700" fill="#14213D" text-anchor="middle">slvr_{src}_etl</text>
  <text x="1048" y="312" font-size="10" fill="#5F7281" text-anchor="middle">Declarative Pipeline</text>
  <text x="1048" y="327" font-size="10" fill="#5F7281" text-anchor="middle">shared engine (semver)</text>

  <rect x="818" y="372" width="130" height="70" rx="8" fill="#E3E6EA" stroke="#9AA7B3"/>
  <text x="883" y="402" font-size="12.5" font-weight="700" fill="#3C4A56" text-anchor="middle">SILVER</text>
  <text x="883" y="421" font-size="10" fill="#5F7281" text-anchor="middle">silver.{entity} + DQ</text>

  <!-- control plane -->
  <rect x="638" y="472" width="480" height="86" rx="8" fill="#F7F4EC" stroke="#D5C9A6"/>
  <text x="652" y="494" font-size="12" font-weight="700" fill="#6E5A12">CONTROL + OBSERVABILITY PLANE (Delta · workspace.ctl)</text>
  <g font-size="10" fill="#6E5E3A">
    <text x="652" y="516">dataflow_spec (tombstoned) · batch_config · job_config</text>
    <text x="652" y="536">ingestion_runs · recon_* · drift_events · watermarks — written by EVERY run</text>
  </g>

  <!-- governance band -->
  <rect x="638" y="578" width="480" height="52" rx="8" fill="#EDF3EE" stroke="#A9C7AF"/>
  <text x="878" y="602" font-size="12" font-weight="700" fill="#1F5A31" text-anchor="middle">Unity Catalog — governance · lineage · PII column tags · grants</text>
  <text x="878" y="620" font-size="10" fill="#4E7A5B" text-anchor="middle">every asset tagged with spec_id + contract_id</text>

  <!-- ZONE: DELIVERY -->
  <rect x="1170" y="92" width="246" height="560" rx="10" fill="#FFFFFF" stroke="#D7DEE6"/>
  <rect x="1170" y="92" width="246" height="34" rx="10" fill="#2E4053"/>
  <text x="1293" y="114" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">DELIVERY + CI/CD</text>

  <rect x="1190" y="146" width="206" height="80" rx="8" fill="#F2F7FB" stroke="#B9CFE2"/>
  <text x="1293" y="172" font-size="12" font-weight="700" fill="#14213D" text-anchor="middle">GitHub — metadata repo</text>
  <text x="1293" y="192" font-size="10" fill="#5F7281" text-anchor="middle">metadata-only PR + EVIDENCE.md</text>
  <text x="1293" y="208" font-size="10" fill="#5F7281" text-anchor="middle">CI: manifest checksums</text>

  <rect x="1190" y="246" width="206" height="54" rx="8" fill="#FFF8E6" stroke="#D9BF6E"/>
  <text x="1293" y="268" font-size="12" font-weight="700" fill="#6E5A12" text-anchor="middle">HUMAN GATE 2 · merge</text>
  <text x="1293" y="286" font-size="10" fill="#8A794C" text-anchor="middle">promotion via bundle deploy</text>

  <rect x="1190" y="320" width="206" height="70" rx="8" fill="#F2F7FB" stroke="#B9CFE2"/>
  <text x="1293" y="344" font-size="12" font-weight="700" fill="#14213D" text-anchor="middle">Framework repo (engine)</text>
  <text x="1293" y="362" font-size="10" fill="#5F7281" text-anchor="middle">one static engine · semver</text>
  <text x="1293" y="378" font-size="10" fill="#5F7281" text-anchor="middle">executes ALL sources</text>

  <rect x="1190" y="412" width="206" height="64" rx="8" fill="#FFFFFF" stroke="#C9D2DB" stroke-dasharray="5 4"/>
  <text x="1293" y="438" font-size="12" fill="#8396A5" text-anchor="middle">dbt · BI · consumers</text>
  <text x="1293" y="456" font-size="10" fill="#AAB7C4" text-anchor="middle">silver tables as sources</text>

  <rect x="1190" y="498" width="206" height="60" rx="8" fill="#FFF8E6" stroke="#D9BF6E"/>
  <text x="1293" y="522" font-size="12" font-weight="700" fill="#6E5A12" text-anchor="middle">HUMAN GATE 3</text>
  <text x="1293" y="540" font-size="10" fill="#8A794C" text-anchor="middle">decommission = typed tombstone</text>

  <!-- FLOWS -->
  <g stroke="#5F7281" stroke-width="1.6" fill="none">
    <path d="M 204 193 L 276 193" marker-end="url(#arr)"/>
    <path d="M 421 210 L 421 226" marker-end="url(#arr)"/>
    <path d="M 421 290 L 421 306" marker-end="url(#arr)"/>
    <path d="M 421 360 L 421 376" marker-end="url(#arr)"/>
    <path d="M 421 440 L 421 456" marker-end="url(#arr)"/>
    <path d="M 421 520 L 421 546" marker-end="url(#arr)"/>
  </g>
  <g stroke="#2272B4" stroke-width="2" fill="none">
    <path d="M 566 408 L 618 408 L 618 192 L 638 192" marker-end="url(#arrb)"/>
    <path d="M 788 304 L 818 304" marker-end="url(#arrb)"/>
    <path d="M 948 304 L 978 304" marker-end="url(#arrb)"/>
    <path d="M 1048 342 L 1048 407 L 948 407" marker-end="url(#arrb)"/>
    <path d="M 566 488 L 602 488 L 602 186 L 638 186"/>
    <path d="M 1118 186 L 1190 186" marker-end="url(#arrb)"/>
  </g>
  <g stroke="#8396A5" stroke-width="1.4" fill="none" stroke-dasharray="6 4">
    <path d="M 124 236 L 124 256"/>
    <path d="M 204 176 C 380 60 600 60 713 260" marker-end="url(#arr)"/>
    <path d="M 948 412 L 1190 444" marker-end="url(#arr)"/>
    <path d="M 1293 390 L 1293 412"/>
  </g>

  <!-- numbered flow labels -->
  <g font-size="10.5" font-weight="700" fill="#FFFFFF">
    <circle cx="240" cy="193" r="9" fill="#14213D"/><text x="240" y="197" text-anchor="middle">1</text>
    <circle cx="421" cy="218" r="9" fill="#14213D"/><text x="421" y="222" text-anchor="middle">2</text>
    <circle cx="421" cy="298" r="9" fill="#14213D"/><text x="421" y="302" text-anchor="middle">3</text>
    <circle cx="602" cy="300" r="9" fill="#14213D"/><text x="602" y="304" text-anchor="middle">4</text>
    <circle cx="878" cy="248" r="9" fill="#14213D"/><text x="878" y="252" text-anchor="middle">5</text>
    <circle cx="1155" cy="186" r="9" fill="#14213D"/><text x="1155" y="190" text-anchor="middle">6</text>
  </g>

  <!-- legend + narrative -->
  <rect x="24" y="672" width="1392" height="164" rx="10" fill="#FFFFFF" stroke="#D7DEE6"/>
  <text x="44" y="700" font-size="13" font-weight="700" fill="#14213D">Flow</text>
  <g font-size="11" fill="#3C4A56">
    <text x="44" y="722">1  Contract upload + live schema discovery (source of truth = the source, not memory)</text>
    <text x="44" y="742">2  LLM proposes the mapping spec — structured output only, prompts stored and visible</text>
    <text x="44" y="762">3  Human gate 1: review and approve; edits become spec versions</text>
    <text x="44" y="782">4  Renderer MERGEs metadata to ctl.dataflow_spec; provisioner ensures Lakeflow assets by name</text>
    <text x="44" y="802">5  Every run: drift gate → ingest → transform → self-log → self-reconcile → refresh dashboards</text>
    <text x="44" y="822">6  Metadata-only PR with evidence; human gate 2 merges; CI promotes via bundle deploy</text>
  </g>
  <text x="760" y="700" font-size="13" font-weight="700" fill="#14213D">Legend</text>
  <g font-size="11" fill="#3C4A56">
    <rect x="760" y="712" width="26" height="14" rx="3" fill="#EAF1F8" stroke="#2272B4"/><text x="794" y="723">Databricks-managed pipeline / app component</text>
    <rect x="760" y="734" width="26" height="14" rx="3" fill="#FFF8E6" stroke="#D9BF6E"/><text x="794" y="745">Human gate (nothing irreversible without one)</text>
    <rect x="760" y="756" width="26" height="14" rx="3" fill="#FDF1E8" stroke="#E8B48C"/><text x="794" y="767">LLM boundary — specs and deltas only, never code</text>
    <rect x="760" y="778" width="26" height="14" rx="3" fill="#F7F4EC" stroke="#D5C9A6"/><text x="794" y="789">Metadata control + observability plane (Delta)</text>
    <rect x="760" y="800" width="26" height="14" rx="3" fill="#FFFFFF" stroke="#C9D2DB" stroke-dasharray="4 3"/><text x="794" y="811">Planned / adjacent (pattern catalog P2–P7, dbt)</text>
  </g>
  <g font-size="11" fill="#3C4A56">
    <text x="1120" y="723">Zero standing credentials on schedule</text>
    <text x="1120" y="745">Recon on every run: key / row / attribute</text>
    <text x="1120" y="767">Spec rows tombstoned — never deleted</text>
    <text x="1120" y="789">Lakebase: ms reads, warehouse fallback</text>
    <text x="1120" y="811">Engine skew fail-fast (framework_min_version)</text>
  </g>
</svg>
